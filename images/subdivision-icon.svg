<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Left fader track -->
  <line x1="5" y1="2.5" x2="5" y2="21.5"/>
  <!-- Center fader track -->
  <line x1="12" y1="2.5" x2="12" y2="21.5"/>
  <!-- Right fader track -->
  <line x1="19" y1="2.5" x2="19" y2="21.5"/>
  <!-- Left handle — near top (high) -->
  <rect x="2" y="6" width="6" height="3.5" rx="1.75"/>
  <!-- Center handle — near bottom (low) -->
  <rect x="9" y="14.5" width="6" height="3.5" rx="1.75"/>
  <!-- Right handle — middle -->
  <rect x="16" y="10.25" width="6" height="3.5" rx="1.75"/>
</svg>
