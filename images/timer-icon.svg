<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Crown button -->
  <rect x="9.5" y="1.5" width="5" height="2.5" rx="1.25"/>
  <!-- Stem from crown to circle face -->
  <line x1="12" y1="4" x2="12" y2="6"/>
  <!-- Side winder button -->
  <line x1="17.5" y1="7.5" x2="19.5" y2="5.5"/>
  <!-- Stopwatch face -->
  <circle cx="12" cy="14" r="8"/>
  <!-- Minute hand pointing to ~10 o'clock -->
  <line x1="12" y1="14" x2="7.5" y2="11"/>
</svg>
